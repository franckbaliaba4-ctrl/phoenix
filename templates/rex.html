
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Phoenix Group - Accueil</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css'  %}">
    <style>
        .modal-content {
            text-align: center;
        }
        .modal-img {
            max-width: 100%;
            height: auto;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Bienvenue sur Phoenix Group</h1>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#pdgModal">
            Voir le message du PDG
        </button>

        <!-- Modale -->
        <div class="modal fade" id="pdgModal" tabindex="-1" aria-labelledby="pdgModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="pdgModalLabel">Message du PDG</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <img src="{% static 'img/about-company-1.jpg' %}" alt="Photo du PDG" class="modal-img">
                        <p><strong>Message :</strong> {{ pdg_message }}</p>
                        <p><strong>Discours :</strong> {{ speech }}</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>
</html>
